[project]
name = "referraleasy-gateway"
version = "0.1.0"
description = "FastAPI gateway: patient/admin sessions, REST commands, the SSE surface stream, the policy check and the guardrail seam"
requires-python = ">=3.12,<3.13"
dependencies = [
  "referraleasy-contracts",
  "referraleasy-domain",
  # §9's three guardrail layers. A dependency of the *gateway*, not only of the workspace: the
  # write path composes them, and the image is built with
  # `uv sync --package referraleasy-gateway`, which installs this service's dependencies and no
  # other member's. Declaring it only at the root would leave the container importing a package
  # that is not in it.
  "referraleasy-guardrails",
  # §15's telemetry bundle. The package is inert unless `OTEL_EXPORTER_OTLP_ENDPOINT` is set, so this
  # dependency costs a service nothing when the stack is not running — but the SDK it brings is what
  # makes a span reachable at all, and an image without it cannot emit however it is configured.
  "referraleasy-telemetry",
  # §16's alert rules and mock outbox. A dependency of the *gateway* for the same reason the
  # guardrails are: the admin page serves the rules and their thresholds from this package rather
  # than a copy, and the image is built with `uv sync --package referraleasy-gateway`.
  "referraleasy-alerts",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  # The control-state port's PostgreSQL adapter calls the domain stores, which need the driver.
  # The transport modules (auth, stream, guardrails) never import it, so the gateway's unit tests
  # run without a database.
  "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/referraleasy_gateway"]

[tool.uv.sources]
referraleasy-contracts = { workspace = true }
referraleasy-domain = { workspace = true }
referraleasy-guardrails = { workspace = true }
referraleasy-telemetry = { workspace = true }
referraleasy-alerts = { workspace = true }
