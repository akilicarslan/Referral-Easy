[project]
name = "referraleasy-contracts"
version = "0.1.0"
description = "Generated Pydantic bindings for the ReferralEasy contract schemas (single source: ../schemas)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9",
  # Required by the generated models: `format: email` (PatientDetails.email) becomes EmailStr,
  # and pydantic raises on class construction without this installed.
  "email-validator>=2.2",
  "jsonschema>=4.23",
]

[dependency-groups]
dev = [
  "datamodel-code-generator>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/referraleasy_contracts"]
