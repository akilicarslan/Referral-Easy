[project]
name = "referraleasy-secrets"
version = "0.1.0"
description = "One SecretProvider interface: file-mounted secrets (compose secrets, Cloud Run volumes), env fixtures for the demo, and a Secret Manager sketch"
requires-python = ">=3.12,<3.13"
dependencies = [
  # `SecretStr`, so a secret's repr is `**********` wherever it travels.
  "pydantic>=2.9",
]

[project.optional-dependencies]
# Only the GCP sketch needs it, and nothing in the demo path imports it.
gcp = ["google-cloud-secret-manager>=2.20"]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/referraleasy_secrets"]
