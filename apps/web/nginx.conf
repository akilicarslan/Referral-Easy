# ════════════════════════════════════════════════════════════════════════════
# ReferralEasy — web client (static bundle)
#
# Installed as /etc/nginx/conf.d/default.conf, so the stock nginx.conf still
# provides the http{} block and this file only declares the server.
#
# Two jobs: serve the built bundle, and give the client a same-origin `/v1`
# prefix so it never needs an absolute gateway URL baked into the image.
#
# Port 3000, matching compose (`3000:3000`) and the health probe.
# ════════════════════════════════════════════════════════════════════════════

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # `add_header` does not merge: a location that declares any header of its
    # own drops every header inherited from here. The four below are therefore
    # repeated verbatim in each location that sets Cache-Control.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── the gateway, same-origin ────────────────────────────────────────────
    #
    # The upstream is a VARIABLE, which means nginx resolves it per request
    # rather than at start-up. That matters: a plain `proxy_pass http://gateway:8080`
    # is resolved when the config loads, so nginx would refuse to start — and
    # the whole image would be dead — whenever the gateway is not on the network
    # (running the web image on its own, a `docker compose up web` without the
    # gateway profile, a different service name). With the variable, a missing
    # gateway costs one 502 on an API call instead of the entire UI, which is
    # the same rule the client itself follows: the screen renders even when the
    # backend does not answer.
    location /v1/ {
        set $gateway_upstream gateway:8080;
        resolver 127.0.0.11 valid=10s ipv6=off;   # Docker's embedded DNS
        resolver_timeout 2s;

        proxy_pass http://$gateway_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── Server-Sent Events ──────────────────────────────────────────────
        # The referral flow is delivered as an SSE stream. Buffering would hold
        # events until the connection closed, which is indistinguishable from a
        # backend that has said nothing — exactly the state this client must
        # never confuse with "no answer". `Connection ""` also drops the
        # default `Connection: close` and keeps the upstream socket alive.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;
    }

    # ── immutable assets ────────────────────────────────────────────────────
    # Vite writes content-hashed filenames, so a change is a new URL and this
    # can be cached indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri =404;
    }

    # ── the three entry documents ───────────────────────────────────────────
    # Never cached: they are the only unhashed URLs, and a stale shell pointing
    # at deleted asset hashes is a blank page.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    location = /demo.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    # The admin app, addressed by hash INSIDE this document (`admin.html#/traces`),
    # which is why no path below needs a rewrite rule — see
    # `src/admin/router.ts`. This alias exists so the entry point is typed as
    # `/admin` rather than dragged out of a file listing.
    location = /admin {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        try_files /admin.html =404;
    }

    location = /admin.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    # ── everything else ─────────────────────────────────────────────────────
    # An unknown path falls back to the PATIENT shell, not a bare nginx 404.
    #
    # This does not make deep paths work, and the earlier version of this comment
    # claimed it did ("the client otherwise routes in-page"). It does not: the
    # patient client reads `?workflow_id=<uuid>` and the admin routes by hash, so
    # a request for `/admin/traces` answers with the patient page — which is a
    # 200 saying the wrong thing. Use `/admin#/traces`, or add a rewrite here if
    # deep links are ever wanted.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
