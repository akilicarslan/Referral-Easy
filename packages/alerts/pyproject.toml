[project]
name = "referraleasy-alerts"
version = "0.1.0"
description = "§16's alert rules, dedup/cooldown and the mock email outbox: decisions over measurements, with 'not enough data' as a state rather than a pass"
requires-python = ">=3.12,<3.13"
dependencies = [
  # §15's Sample and Percentiles. Every rule here is a decision about a number that came with its
  # sample size, so restating either would be a second answer to what a sample is.
  "referraleasy-telemetry",
]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/referraleasy_alerts"]

[tool.uv.sources]
referraleasy-telemetry = { workspace = true }
