[project]
name = "referraleasy-telemetry"
version = "0.1.0"
description = "OTel spans, structured operation events and the OpenSearch query layer for §15 analytics"
requires-python = ">=3.12,<3.13"
dependencies = [
  # The API and the SDK. No exporter package is listed, and that is deliberate rather than an
  # oversight: `referraleasy_telemetry.export` speaks OTLP/HTTP JSON itself, and the vendor
  # exporter (`opentelemetry-exporter-otlp-proto-http`) was not in this workspace's virtualenv
  # when the phase landed. The module docstring records what that costs. When this package is next
  # synced, adding the vendor exporter and switching `setup.configure_telemetry` to it is a one-line
  # change; listing it here before then would be declaring a dependency nothing imports.
  "opentelemetry-api>=1.30.0",
  "opentelemetry-sdk>=1.30.0",
  # The OTLP transport, and the client the query layer uses for OpenSearch. Both are plain HTTP
  # clients; `httpx` is already on the workspace's dependency path, so this adds no new resolution.
  "httpx>=0.28.0",
]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/referraleasy_telemetry"]
