# §0.1: secrets never committed. gitleaks is the gate; ruff keeps the tree clean.
default_install_hook_types: [pre-commit]
fail_fast: true

repos:
  - repo: local
    hooks:
      - id: public-release-privacy
        name: No private files or machine paths
        entry: python3 scripts/check_public_release.py --tracked-only
        language: system
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.md$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Kept in step with the `ruff` pin in pyproject.toml's dev group, which is what `make lint` and
    # the CI workflow actually run. They were apart (v0.8.6 here, 0.17.0 there) and that is not a
    # cosmetic difference: this hook formats with its own version, so a commit could be made with a
    # tree the CI gate then rejects. Bump both together.
    rev: v0.17.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
