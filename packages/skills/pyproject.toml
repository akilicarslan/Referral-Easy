[project]
name = "referraleasy-skills"
version = "0.1.0"
description = "Versioned skill packages: selection manifests, instruction bodies and read-only reference material"
requires-python = ">=3.12,<3.13"
# Deliberately dependency-free. The loader is what a selector calls on every turn, so it must not
# drag a model SDK, a driver or a web framework into the import path. It is stdlib-only and offline.
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/referraleasy_skills"]
