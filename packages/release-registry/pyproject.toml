[project]
name = "referraleasy-release-registry"
version = "0.1.0"
description = "The §13 release manifest: artifact hashing, the version ledger, the version-bump gate, conversation pinning and canary routing"
requires-python = ">=3.12,<3.13"
dependencies = [
  # `ReleaseManifest` and its sub-models are generated contracts, not a shape invented here:
  # the manifest this package emits is validated by the same schema the gateway and the eval CLI
  # read, so "the registry and the consumers agree" is checked by pydantic rather than by review.
  "referraleasy-contracts",
]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/referraleasy_release_registry"]

[tool.uv.sources]
referraleasy-contracts = { workspace = true }
