[project]
name = "referraleasy-domain"
version = "0.1.0"
description = "Typed client over the PostgreSQL control-state primitives (workflow, policy, approval, command dedup)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "referraleasy-contracts",
  # The store talks to PostgreSQL. Imported lazily in store modules so the pure helpers and their
  # unit tests need no driver and no database.
  "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/referraleasy_domain"]

[tool.uv.sources]
referraleasy-contracts = { workspace = true }
