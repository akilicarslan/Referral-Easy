[project]
name = "referraleasy-rag"
version = "0.1.0"
description = "Hybrid RAG over the synthetic directory: entity-aware chunking, BM25 + kNN with RRF, rerank, and an explicit degradation ladder"
requires-python = ">=3.12,<3.13"
dependencies = [
  # The frozen contract types. Fixtures are validated through them before chunking, so a
  # fixture that drifts from the schema fails at index time instead of producing a plausible
  # chunk of nonsense.
  "referraleasy-contracts",
  "opensearch-py==3.2.0",
  "httpx>=0.28.0",
]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/referraleasy_rag"]

[tool.uv.sources]
referraleasy-contracts = { workspace = true }
